name: Publish public xeokit runtime

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  RELEASE_ALLOWED_PARENT_ORIGINS: https://ingenia.vn,https://staging.ingenia.vn

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact tag revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm

      - name: Resolve fail-closed release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          printf 'RELEASE_VERSION=%s\n' "$version" >>"$GITHUB_ENV"
          printf 'RELEASE_REVISION=%s\n' "$GITHUB_SHA" >>"$GITHUB_ENV"
          printf 'RELEASE_SOURCE_URL=https://github.com/ingeniacsc/ingenia-xeokit-runtime/tree/%s\n' "$GITHUB_SHA" >>"$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")" >>"$GITHUB_ENV"

      - name: Install and validate exact source
        run: |
          npm ci --ignore-scripts
          npm run converter:prepare
          npm run converter:version
          npm run converter:smoke
          npm test
          npm run security:audit
          npm run validate:publication
          npm run sbom:generate
          SBOM_SCOPE=viewer npm run sbom:generate
          SBOM_SCOPE=converter npm run sbom:generate
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Viewer image
        id: viewer
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/ingeniacsc/ingenia-xeokit-viewer:${{ env.RELEASE_VERSION }}
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            SOURCE_REVISION=${{ env.RELEASE_REVISION }}
            SOURCE_URL=${{ env.RELEASE_SOURCE_URL }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            VITE_ALLOWED_PARENT_ORIGINS=${{ env.RELEASE_ALLOWED_PARENT_ORIGINS }}

      - name: Publish Converter image
        id: converter
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Converter.Dockerfile
          push: true
          tags: ghcr.io/ingeniacsc/ingenia-xeokit-converter:${{ env.RELEASE_VERSION }}
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            SOURCE_REVISION=${{ env.RELEASE_REVISION }}
            SOURCE_URL=${{ env.RELEASE_SOURCE_URL }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}

      - name: Collect SBOMs from the immutable images
        shell: bash
        env:
          VIEWER_DIGEST: ${{ steps.viewer.outputs.digest }}
          CONVERTER_DIGEST: ${{ steps.converter.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --entrypoint cat "ghcr.io/ingeniacsc/ingenia-xeokit-viewer@$VIEWER_DIGEST" /usr/share/nginx/html/legal/sbom.spdx.json > sbom.viewer.spdx.json
          docker run --rm --network none --entrypoint cat "ghcr.io/ingeniacsc/ingenia-xeokit-converter@$CONVERTER_DIGEST" /licenses/sbom.spdx.json > sbom.converter.spdx.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { normalizeSpdxDocument, validateReleaseMetadata } from './scripts/generate-release-sbom.mjs';
          const metadata = validateReleaseMetadata();
          for (const scope of ['viewer', 'converter']) {
            const raw = JSON.parse(readFileSync(`sbom.${scope}.spdx.json`, 'utf8'));
            const expected = normalizeSpdxDocument(raw, metadata, scope);
            if (raw.documentNamespace !== expected.documentNamespace || raw.creationInfo?.comment !== expected.creationInfo.comment) {
              throw new Error(`Image SBOM source binding mismatch: ${scope}`);
            }
          }
          NODE

      - name: Attest Viewer image provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/ingeniacsc/ingenia-xeokit-viewer
          subject-digest: ${{ steps.viewer.outputs.digest }}
          push-to-registry: true

      - name: Attest Converter image provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/ingeniacsc/ingenia-xeokit-converter
          subject-digest: ${{ steps.converter.outputs.digest }}
          push-to-registry: true

      - name: Verify published images by immutable digest
        shell: bash
        env:
          VIEWER_IMAGE: ghcr.io/ingeniacsc/ingenia-xeokit-viewer@${{ steps.viewer.outputs.digest }}
          CONVERTER_IMAGE: ghcr.io/ingeniacsc/ingenia-xeokit-converter@${{ steps.converter.outputs.digest }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/ingenia-release-converter"
          install -d -m 0777 "$output"
          docker logout ghcr.io
          docker pull "$VIEWER_IMAGE"
          docker pull "$CONVERTER_IMAGE"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "$PWD/tests/fixtures:/fixtures:ro" \
            --volume "$output:/out" \
            "$CONVERTER_IMAGE" \
            --source /fixtures/ingenia-smoke-wall.ifc \
            --format ifc \
            --output /out/ingenia-smoke-wall.xkt
          node scripts/verify-xkt-smoke-output.mjs \
            "$output/ingenia-smoke-wall.xkt"

          viewer_container="ingenia-release-viewer-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$viewer_container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$viewer_container" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:3100:8080 \
            --env XEOKIT_FRAME_ANCESTORS=https://staging.ingenia.vn \
            --env XEOKIT_CONNECT_SRC=https://staging.ingenia.vn \
            "$VIEWER_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3100/ >/dev/null && break
            [ "$attempt" -lt 30 ]
            sleep 1
          done
          VIEWER_BASE_URL=http://127.0.0.1:3100 \
          VIEWER_PARENT_ORIGIN=https://staging.ingenia.vn \
          VIEWER_API_ORIGIN=https://staging.ingenia.vn \
            node scripts/verify-running-image.mjs

      - name: Record release binding
        shell: bash
        env:
          VIEWER_DIGEST: ${{ steps.viewer.outputs.digest }}
          CONVERTER_DIGEST: ${{ steps.converter.outputs.digest }}
        run: |
          set -Eeuo pipefail
          {
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'revision=%s\n' "$RELEASE_REVISION"
            printf 'source=%s\n' "$RELEASE_SOURCE_URL"
            printf 'sbom_sha256=%s\n' "$(sha256sum sbom.spdx.json | awk '{print $1}')"
            printf 'viewer_sbom_sha256=%s\n' "$(sha256sum sbom.viewer.spdx.json | awk '{print $1}')"
            printf 'converter_sbom_sha256=%s\n' "$(sha256sum sbom.converter.spdx.json | awk '{print $1}')"
            printf 'viewer_digest=%s\n' "$VIEWER_DIGEST"
            printf 'converter_digest=%s\n' "$CONVERTER_DIGEST"
          } > release-binding.txt

      - name: Upload public release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xeokit-runtime-${{ env.RELEASE_VERSION }}-evidence
          path: |
            sbom.spdx.json
            sbom.viewer.spdx.json
            sbom.converter.spdx.json
            release-binding.txt
          if-no-files-found: error
          retention-days: 90
