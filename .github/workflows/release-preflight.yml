name: Preflight public xeokit runtime publication

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: xeokit-runtime-publication-preflight
  cancel-in-progress: false

env:
  RELEASE_ALLOWED_PARENT_ORIGINS: https://ingenia.vn,https://staging.ingenia.vn

jobs:
  publish-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact public revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm

      - name: Resolve fail-closed preflight metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="0.2.0-preflight.${GITHUB_RUN_ID}"
          tag="preflight-${GITHUB_RUN_ID}-${GITHUB_SHA::12}"
          printf 'RELEASE_VERSION=%s\n' "$version" >>"$GITHUB_ENV"
          printf 'PREFLIGHT_IMAGE_TAG=%s\n' "$tag" >>"$GITHUB_ENV"
          printf 'RELEASE_REVISION=%s\n' "$GITHUB_SHA" >>"$GITHUB_ENV"
          printf 'RELEASE_SOURCE_URL=https://github.com/ingeniacsc/ingenia-xeokit-runtime/tree/%s\n' "$GITHUB_SHA" >>"$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")" >>"$GITHUB_ENV"

      - name: Validate exact source and real conversion
        run: |
          npm ci --ignore-scripts
          npm run converter:prepare
          npm run converter:version
          npm run converter:smoke
          npm test
          npm run security:audit
          npm run validate:publication
          npm run sbom:generate
          VITE_ALLOWED_PARENT_ORIGINS="$RELEASE_ALLOWED_PARENT_ORIGINS" npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Viewer preflight image
        id: viewer
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/ingeniacsc/ingenia-xeokit-viewer:${{ env.PREFLIGHT_IMAGE_TAG }}
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            SOURCE_REVISION=${{ env.RELEASE_REVISION }}
            SOURCE_URL=${{ env.RELEASE_SOURCE_URL }}
            VITE_ALLOWED_PARENT_ORIGINS=${{ env.RELEASE_ALLOWED_PARENT_ORIGINS }}

      - name: Publish Converter preflight image
        id: converter
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Converter.Dockerfile
          push: true
          tags: ghcr.io/ingeniacsc/ingenia-xeokit-converter:${{ env.PREFLIGHT_IMAGE_TAG }}
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            SOURCE_REVISION=${{ env.RELEASE_REVISION }}
            SOURCE_URL=${{ env.RELEASE_SOURCE_URL }}

      - name: Attest Viewer preflight provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/ingeniacsc/ingenia-xeokit-viewer
          subject-digest: ${{ steps.viewer.outputs.digest }}
          push-to-registry: true

      - name: Attest Converter preflight provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/ingeniacsc/ingenia-xeokit-converter
          subject-digest: ${{ steps.converter.outputs.digest }}
          push-to-registry: true

      - name: Pull and verify both preflight images by digest
        shell: bash
        env:
          VIEWER_IMAGE: ghcr.io/ingeniacsc/ingenia-xeokit-viewer@${{ steps.viewer.outputs.digest }}
          CONVERTER_IMAGE: ghcr.io/ingeniacsc/ingenia-xeokit-converter@${{ steps.converter.outputs.digest }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/ingenia-preflight-converter"
          install -d -m 0777 "$output"
          docker logout ghcr.io
          docker pull "$VIEWER_IMAGE"
          docker pull "$CONVERTER_IMAGE"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "$PWD/tests/fixtures:/fixtures:ro" \
            --volume "$output:/out" \
            "$CONVERTER_IMAGE" \
            --source /fixtures/ingenia-smoke-wall.ifc \
            --format ifc \
            --output /out/ingenia-smoke-wall.xkt
          node scripts/verify-xkt-smoke-output.mjs \
            "$output/ingenia-smoke-wall.xkt"

          viewer_container="ingenia-preflight-viewer-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$viewer_container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$viewer_container" \
            --read-only \
            --tmpfs /etc/nginx/conf.d:rw,noexec,nosuid,size=1m \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=16m \
            --tmpfs /var/run:rw,noexec,nosuid,size=1m \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add NET_BIND_SERVICE \
            --cap-add SETGID \
            --cap-add SETUID \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:3100:8080 \
            --env XEOKIT_FRAME_ANCESTORS=https://staging.ingenia.vn \
            --env XEOKIT_CONNECT_SRC=https://staging.ingenia.vn \
            "$VIEWER_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3100/ >/dev/null && break
            [ "$attempt" -lt 30 ]
            sleep 1
          done
          VIEWER_BASE_URL=http://127.0.0.1:3100 \
          VIEWER_PARENT_ORIGIN=https://staging.ingenia.vn \
          VIEWER_API_ORIGIN=https://staging.ingenia.vn \
            node scripts/verify-running-image.mjs

      - name: Record non-release preflight binding
        shell: bash
        env:
          VIEWER_DIGEST: ${{ steps.viewer.outputs.digest }}
          CONVERTER_DIGEST: ${{ steps.converter.outputs.digest }}
        run: |
          set -Eeuo pipefail
          {
            printf 'status=PRE_RELEASE_PREFLIGHT_ONLY\n'
            printf 'deployment=NONE\n'
            printf 'release_tag=NONE\n'
            printf 'cleanup_required=MANUAL_AFTER_EVIDENCE_ACCEPTED\n'
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'revision=%s\n' "$RELEASE_REVISION"
            printf 'source=%s\n' "$RELEASE_SOURCE_URL"
            printf 'allowed_parent_origins=%s\n' "$RELEASE_ALLOWED_PARENT_ORIGINS"
            printf 'viewer_tag=ghcr.io/ingeniacsc/ingenia-xeokit-viewer:%s\n' "$PREFLIGHT_IMAGE_TAG"
            printf 'converter_tag=ghcr.io/ingeniacsc/ingenia-xeokit-converter:%s\n' "$PREFLIGHT_IMAGE_TAG"
            printf 'viewer_digest=%s\n' "$VIEWER_DIGEST"
            printf 'converter_digest=%s\n' "$CONVERTER_DIGEST"
          } > release-preflight-binding.txt

      - name: Upload public preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xeokit-runtime-preflight-${{ github.run_id }}-evidence
          path: release-preflight-binding.txt
          if-no-files-found: error
          retention-days: 90
