server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Link '<https://github.com/ingeniacsc/ingenia-xeokit-runtime>; rel="source"' always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' ${XEOKIT_CONNECT_SRC}; worker-src 'self' blob:; frame-ancestors ${XEOKIT_FRAME_ANCESTORS}" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
