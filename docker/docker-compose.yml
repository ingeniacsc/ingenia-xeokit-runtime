services:
  viewer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ALLOW_CANDIDATE_REVISION: "true"
        RELEASE_VERSION: 0.2.0-dev
        SOURCE_REVISION: 0000000000000000000000000000000000000000
        SOURCE_URL: https://github.com/ingeniacsc/ingenia-xeokit-runtime/tree/0000000000000000000000000000000000000000
        VITE_ALLOWED_PARENT_ORIGINS: https://ingenia.vn,https://staging.ingenia.vn
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    ports:
      - "127.0.0.1:3100:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
